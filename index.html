
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danna Mentorship</title>
    <!-- Fuentes e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
        }

        header { text-align: center; margin-bottom: 20px; }

        .level-card {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .stats { display: flex; justify-content: space-around; margin-top: 10px; font-weight: 600; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; border: none; background: #e2e8f0; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .tab.active { background: var(--primary); color: white; }

        .card { background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9; }
        
        textarea {
            width: 100%; height: 100px; border: 1px solid #e2e8f0;
            border-radius: 10px; padding: 10px; box-sizing: border-box; resize: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Danna Mentorship 🚀</h1>
    </header>

    <div class="level-card">
        <h2 id="rank">Aprendiz</h2>
        <div class="stats">
            <span id="level">Nivel 1</span>
            <span id="xp-count">XP: 0</span>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('missions')">Misiones</button>
        <button class="tab" onclick="switchTab('journal')">Reflexión</button>
    </div>

    <div id="missions-view" class="card">
        <input type="text" id="missionInput" placeholder="¿Qué toca aprender hoy?" style="width: 70%; padding: 8px;">
        <button onclick="addMission()" style="padding: 8px; background: var(--primary); color: white; border: none; border-radius: 5px;">+</button>
        <ul id="missionList"></ul>
    </div>

    <div id="journal-view" class="card" style="display: none;">
        <h3>Mi diario de hoy</h3>
        <textarea id="journalInput" placeholder="¿Cómo te has sentido hoy?"></textarea>
        <button onclick="saveJournal()" style="margin-top: 10px; width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 10px;">Guardar Nota</button>
    </div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('dannaData')) || { missions: [], xp: 0, journal: "" };

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('missions-view').style.display = tab === 'missions' ? 'block' : 'none';
        document.getElementById('journal-view').style.display = tab === 'journal' ? 'block' : 'none';
    }

    function addMission() {
        const input = document.getElementById('missionInput');
        if(!input.value) return;
        data.missions.push({ text: input.value, completed: false });
        input.value = '';
        save();
        render();
    }

    function toggleMission(index) {
        data.missions[index].completed = !data.missions[index].completed;
        if(data.missions[index].completed) data.xp += 20;
        else data.xp = Math.max(0, data.xp - 20);
        save();
        render();
    }

    function render() {
        const list = document.getElementById('missionList');
        list.innerHTML = '';
        data.missions.forEach((m, i) => {
            list.innerHTML += `<li style="${m.completed ? 'opacity: 0.5' : ''}">
                <button onclick="toggleMission(${i})" style="border:none; background:none; cursor:pointer;">
                    <i class="fa-${m.completed ? 'solid' : 'regular'} fa-check-circle" style="color:var(--primary); font-size: 20px;"></i>
                </button>
                <span style="flex-grow:1; margin-left:10px">${m.text}</span>
            </li>`;
        });
        updateStats();
    }

    function updateStats() {
        let level = Math.floor(data.xp / 100) + 1;
        document.getElementById('level').innerText = "Nivel " + level;
        document.getElementById('xp-count').innerText = "XP: " + data.xp;
        document.getElementById('rank').innerText = level > 5 ? "Mentora Junior" : "Aprendiz";
    }

    function save() { localStorage.setItem('dannaData', JSON.stringify(data)); }
    
    function saveJournal() {
        data.journal = document.getElementById('journalInput').value;
        save();
        alert("¡Nota guardada! Lo leeremos juntos.");
    }

    // Cargar contenido inicial en textarea si existe
    document.getElementById('journalInput').value = data.journal;
    render();
</script>
</body>
</html>
